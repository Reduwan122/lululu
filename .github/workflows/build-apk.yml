name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 📝 Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: 📱 Generate Native Android Project
        run: |
          npx expo prebuild --platform android --clean --no-install
          echo "android.kotlinVersion=2.0.21" >> android/gradle.properties
          echo "android.enablePngCrunchInReleaseBuilds=false" >> android/gradle.properties

      - name: ⚙️ Make Gradlew Executable
        run: chmod +x ./android/gradlew

      - name: 🔨 Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon -Pandroid.kotlinVersion=2.0.21 --stacktrace 2>&1 | tee ../gradle.log

      - name: 📋 Check Gradle Log on Failure
        if: always()
        run: |
          if [ -f gradle.log ]; then
            echo "### Last 150 Lines of Gradle Log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 150 gradle.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: 📤 Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle.log

      - name: 🔍 Check Built APK
        run: |
          ls -lh android/app/build/outputs/apk/release/

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: absher-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
